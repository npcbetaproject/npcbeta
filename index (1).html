const characters=[
{id:'cassian-holt',name:'Cassian Holt',role:'Adventurer',background:'Fallen nobility',locations:['Town','Ruins','Wilderness'],tags:['Fortune seeker','Family duty'],motivation:'Seeking adventure and riches to restore his fallen house.',personality:'Courteous, but sensitive about his family name.',hook:'He needs companions to recover a lost family heirloom.'},
{id:'mira-fen',name:'Mira Fen',role:'Apothecary',background:'Village herbalist',locations:['Town','Wilderness'],tags:['Herbalist','Quiet observer'],motivation:'Protect her village and discover a cure for a spreading blight.',personality:'Soft-spoken and precise; notices what others overlook.',hook:'A rare medicinal plant grows near a ruin nobody will enter.'},
{id:'brother-alden',name:'Brother Alden',role:'Priest',background:'Keeper of the village church',locations:['Town','Ruins'],tags:['Spiritual guide','Hidden knowledge'],motivation:'Protect his congregation from what lies beneath the church.',personality:'Warm and reassuring, until someone mentions the crypt.',hook:'The church bell rings at midnight although its rope was cut.'},
{id:'nessa-vale',name:'Nessa Vale',role:'Smuggler',background:'Dockside fixer',locations:['Town','Wilderness'],tags:['Underworld ties','Resourceful'],motivation:'Earn enough to buy her freedom from a powerful patron.',personality:'Quick with a joke; always watches the nearest exit.',hook:'She offers passage if the party helps retrieve a missing cargo.'}
].map((c,i)=>({...c,portrait:portraits[i]}));
let storageAvailable=true;function readSet(key){try{return new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch(e){storageAvailable=false;return new Set()}}
let saved=readSet('npcbeta-saved'),session=readSet('npcbeta-session');let search='',roles=new Set(),locations=new Set(),sort='name',filtersOpen=false;
function persist(){try{localStorage.setItem('npcbeta-saved',JSON.stringify([...saved]));localStorage.setItem('npcbeta-session',JSON.stringify([...session]));}catch(e){storageAvailable=false;}counts()}
function counts(){document.getElementById('saved-count').textContent=saved.size;document.getElementById('session-count').textContent=session.size}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2200)}
function toggleSaved(id){saved.has(id)?saved.delete(id):saved.add(id);persist();render();toast(saved.has(id)?'Character saved':'Character removed from saved')}
const main=document.getElementById('main');const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function current(){return location.hash.slice(1)||'library'}
function card(c){return `<article class="card"><button class="open-card" data-character="${c.id}" aria-label="View ${c.name}"><img class="portrait" src="${c.portrait}" alt="Portrait of ${c.name}"><div class="card-body"><h3>${c.name}</h3><p class="role">${c.role}</p><span class="tag">${c.tags[0]}</span></div></button><button class="bookmark" data-save="${c.id}" aria-label="${saved.has(c.id)?'Unsave':'Save'} ${c.name}" aria-pressed="${saved.has(c.id)}">${saved.has(c.id)?'★':'☆'}</button></article>`}
function drawGrid(view){const list=characters.filter(c=>(view!=='saved'||saved.has(c.id))&&(view!=='session'||session.has(c.id))&&(!roles.size||roles.has(c.role))&&(!locations.size||c.locations.some(l=>locations.has(l)))&&[c.name,c.role,c.background,c.motivation,...c.tags].join(' ').toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a[sort].localeCompare(b[sort]));document.getElementById('grid').innerHTML=list.length?list.map(card).join(''):'<p class="empty">No characters here yet. Try clearing your filters or adding characters from the library.</p>';document.getElementById('results').textContent=`${list.length} character${list.length===1?'':'s'}`;}
function render(){let view=current();document.querySelectorAll('nav button').forEach(b=>{const active=view===b.dataset.view||(view.startsWith('character/')&&b.dataset.view==='library');b.classList.toggle('active',active);active?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});counts();
if(view.startsWith('character/')){const c=characters.find(c=>c.id===view.split('/')[1]);if(!c){main.innerHTML='<h1>Character not found</h1><a href="#library">Return to library</a>';return}main.innerHTML=`<a class="back" href="#library">← Library / ${c.name}</a><div class="profile"><img class="profile-photo" src="${c.portrait}" alt="Portrait of ${c.name}"><section><h1>${c.name}</h1><p class="role">${c.role} · ${c.background}</p>${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}<p class="motivation">${c.motivation}</p><div class="details"><section class="detail"><h2>At the table</h2><p>${c.personality}</p></section><section class="detail"><h2>Adventure hook</h2><p>${c.hook}</p></section></div><div class="actions"><button class="primary" data-session="${c.id}">${session.has(c.id)?'Remove from session':'+ Add to session'}</button><button class="secondary" data-save="${c.id}">${saved.has(c.id)?'★ Saved character':'☆ Save character'}</button></div><p class="example-note">Prototype content: ${c.id==='cassian-holt'?'Cassian’s background and motivation are confirmed; personality and hook are illustrative.':'This character is an illustrative example.'}</p></section></div>`;return}
if(!['library','saved','session'].includes(view))view='library';const headings={library:['Find your next character','Memorable NPCs. Ready to play.'],saved:['Saved characters','Your favourites, ready when you need them.'],session:['Your session','Keep the cast for your next adventure together.']};
main.innerHTML=`<div class="intro"><h1>${headings[view][0]}</h1><p class="subtitle">${headings[view][1]}</p></div><div class="layout"><aside class="filters ${filtersOpen?'visible':''}" id="filters"><h2>Filters</h2>${[['Role',[...new Set(characters.map(c=>c.role))],roles],['Location fit',['Town','Wilderness','Ruins'],locations]].map(([title,options,set])=>`<fieldset><legend>${title}</legend>${options.map(value=>`<label><input type="checkbox" data-filter="${title==='Role'?'role':'location'}" value="${value}" ${set.has(value)?'checked':''}>${value}</label>`).join('')}</fieldset>`).join('')}<button class="link" id="clear">Clear filters</button></aside><section aria-label="Character results"><div class="toolbar"><input class="search" id="search" type="search" aria-label="Search characters" placeholder="Search characters…" value="${safe(search)}"><select id="sort" aria-label="Sort characters"><option value="name" ${sort==='name'?'selected':''}>Sort: Name</option><option value="role" ${sort==='role'?'selected':''}>Sort: Role</option></select><button class="filter-toggle" id="filter-toggle" aria-expanded="${filtersOpen}" aria-controls="filters">Filters</button></div><p id="results" class="result-count" aria-live="polite"></p><div class="grid" id="grid"></div>${view==='session'?'<p class="session-note">Your session list is stored in this browser. Open a character to remove them from the session.</p>':''}${!storageAvailable?'<p class="session-note">Browser storage is unavailable. Your selections will last for this visit only.</p>':''}</section></div>`;drawGrid(view);
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;drawGrid(view)});document.getElementById('sort').addEventListener('change',e=>{sort=e.target.value;drawGrid(view)});document.getElementById('clear').onclick=()=>{roles.clear();locations.clear();search='';render()};document.getElementById('filter-toggle').onclick=()=>{filtersOpen=!filtersOpen;render()};document.querySelectorAll('[data-filter]').forEach(el=>el.onchange=()=>{const set=el.dataset.filter==='role'?roles:locations;el.checked?set.add(el.value):set.delete(el.value);drawGrid(view)});
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){search='';roles.clear();locations.clear();location.hash=b.dataset.view;render()}if(b.dataset.character)location.hash='character/'+b.dataset.character;if(b.dataset.save)toggleSaved(b.dataset.save);if(b.dataset.session){const id=b.dataset.session;session.has(id)?session.delete(id):session.add(id);persist();render();toast(session.has(id)?'Added to session':'Removed from session')}});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
