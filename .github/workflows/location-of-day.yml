name: Location of the Day checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/location-of-day.test.cjs
      - run: node tests/location-of-day.browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: location-of-day-screenshots
          path: project/screenshots/location-of-day-*.png
          if-no-files-found: ignore
