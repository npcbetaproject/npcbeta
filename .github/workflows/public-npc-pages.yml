name: Build public NPC pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-npc-pages.cjs
      - run: node scripts/build-npc-pages.cjs --check
      - run: npm install --no-save --package-lock=false jsdom playwright
      - run: node tests/public-npc-pages.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/public-npc-pages.browser.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
