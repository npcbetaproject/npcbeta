<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Find memorable, ready-to-play fantasy characters for your next session.">
    <meta name="theme-color" content="#f8f4ed">
    <title>NPC Beta — Character library</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/portraits.js" defer></script>
    <script src="js/character-portraits.js" defer></script>
    <script src="js/generator.js" defer></script>
    <script src="js/locations.js" defer></script>
    <script src="js/pro.js" defer></script>
    <script src="js/generated-visuals.js" defer></script>
    <script src="js/session-board.js" defer></script>
    <script src="js/npc-urls.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#library" data-view="library" aria-label="NPC Beta — Library"><img class="brand-logo" src="images/branding/npc-beta-logo.png" width="300" height="97" alt="NPC Beta"></a>
      <nav class="desktop-nav" aria-label="Primary">
        <button class="nav-link active" type="button" data-view="library">Library</button>
        <button class="nav-link" type="button" data-view="locations">Locations</button>
        <button class="nav-link" type="button" data-view="generator">Name Generator</button>
        <button class="nav-link" type="button" data-view="session">Session</button>
        <button class="nav-link" type="button" data-view="support">Support Us</button>
      </nav>
    </header>

    <main>
      <section class="library" aria-labelledby="library-title">
        <div class="library-toolbar">
          <h1 id="library-title">NPC Library</h1>
          <label class="search-field" for="character-search">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            <span class="visually-hidden">Search characters</span>
            <input id="character-search" type="search" placeholder="Search characters…" autocomplete="off">
          </label>
          <label class="sort-field"><span>Sort:</span><select id="character-sort" aria-label="Sort characters"><option value="recent">Most recent</option><option value="name">Name</option><option value="role">Role</option></select></label>
          <button class="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-panel">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg><span class="filter-toggle-label">Filters</span>
          </button>
        </div>

        <div class="library-layout">
          <aside class="filter-panel" id="filter-panel" aria-label="Filter characters">
            <div class="filter-heading"><h2>Filters</h2><span aria-hidden="true">✧</span></div>
            <fieldset id="saved-filter-group"><legend>Collection</legend><label class="filter-option"><input id="saved-filter" type="checkbox"><span id="saved-filter-label">Saved (0)</span></label></fieldset>
            <fieldset><legend>Role</legend><div id="role-filters"></div></fieldset>
            <fieldset><legend>Location fit</legend><div id="location-filters"></div></fieldset>
            <button class="clear-filters" type="button">Clear filters</button>
          </aside>
          <div class="library-results">
            <p class="results-note" id="results-note" role="status">Loading characters…</p>
            <div class="character-grid" id="character-grid"></div>
          </div>
        </div>
      </section>

      <section id="session-board" aria-labelledby="session-board-title" hidden>
        <div class="session-board-toolbar">
          <div class="session-board-heading"><h1 id="session-board-title">Session</h1><span>Live reference</span><span id="session-overview-counts" class="session-overview-counts"></span></div>
          <div class="session-board-search"><label class="search-field" for="session-search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span class="visually-hidden">Search session NPCs and locations</span><input id="session-search" type="search" placeholder="Search names, professions, places…" autocomplete="off"></label><button id="session-clear-search" type="button" aria-label="Clear session search" disabled>Clear</button></div>
          <div class="session-tabs" role="tablist" aria-label="Session references"><button id="session-tab-npcs" type="button" role="tab" aria-controls="session-npc-column" aria-selected="true" tabindex="0" data-session-tab="npcs">NPCs <span id="session-tab-npc-count">0</span></button><button id="session-tab-locations" type="button" role="tab" aria-controls="session-locations" aria-selected="false" tabindex="-1" data-session-tab="locations">Locations <span id="session-tab-location-count">0</span></button></div>
          <p id="session-search-status" class="visually-hidden" role="status"></p>
        </div>
        <div class="session-board-columns"><div id="session-scene-backdrop" aria-hidden="true"></div>
          <section id="session-locations" class="session-column" aria-labelledby="session-locations-title"><div class="session-column-heading"><h2 id="session-locations-title">Locations</h2><span id="session-location-count"></span></div><p id="session-location-reorder-note" class="session-reorder-note" hidden>Clear search to reorder locations.</p><div id="session-location-list"></div></section>
          <section id="session-active-scene" class="session-column" aria-labelledby="session-scene-title"><div class="session-column-heading"><h2 id="session-scene-title">Active scene</h2></div><div id="session-scene-content" aria-live="off"></div></section>
          <section id="session-npc-column" class="session-column" aria-labelledby="session-npcs-title"><div class="session-column-heading"><h2 id="session-npcs-title">Tonight’s Cast</h2><span id="session-npc-count"></span></div><p id="session-adding-to" class="session-adding-to" aria-live="polite"></p></section>
        </div>
      </section>

      <section id="locations-view" aria-labelledby="locations-title" hidden>
        <div class="locations-toolbar">
          <h1 id="locations-title">Locations</h1>
          <label class="search-field" for="location-search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span class="visually-hidden">Search locations</span><input id="location-search" type="search" placeholder="Search locations…" autocomplete="off"></label>
          <label class="sort-field location-sort"><span>Sort:</span><select id="location-sort" aria-label="Sort locations"><option value="recent">Most recent</option><option value="name">Name</option></select></label>
          <button id="location-filter-toggle" class="location-filter-toggle" type="button" aria-expanded="false" aria-controls="location-filter-panel">Filters</button>
        </div>
        <div class="locations-layout">
          <aside id="location-filter-panel" class="filter-panel location-filter-panel" aria-label="Filter locations"><div class="filter-heading"><h2>Filters</h2><span aria-hidden="true">✧</span></div><fieldset><legend>Setting</legend><div id="setting-options"></div></fieldset><fieldset><legend>Condition</legend><div id="condition-options"></div></fieldset><button type="button" class="clear-filters" id="clear-location-filters">Clear filters</button></aside>
          <div class="locations-results"><p id="location-results-note" class="results-note" role="status">Loading locations…</p><div id="location-grid" class="location-grid"></div></div>
        </div>
      </section>

      <section id="generator-view" class="generator-layout" aria-labelledby="generator-title" hidden>
        <div class="generator-card">
          <h1 id="ge
